<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#722f37"><title>Jolie Wren Stories</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><button class="brand" id="homeBtn" aria-label="Home">Jolie Wren <em>Stories</em></button><button class="icon-button" id="menuBtn" aria-label="Open reader settings" aria-expanded="false">☰</button></header>
<main id="app"><div class="loading">Opening the storybook…</div></main>
<div class="shade" id="shade" hidden></div><aside class="drawer" id="drawer" aria-label="Reader settings" aria-hidden="true"><div class="drawer-head"><strong>Reading Settings</strong><button id="closeMenu" class="icon-button" aria-label="Close settings">✕</button></div><label>Reading mode<select id="modeSetting"><option value="episode">Episode</option><option value="continuous">Continuous</option></select></label><label>Theme<select id="themeSetting"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Typography<select id="fontSetting"><option value="serif">Serif</option><option value="sans">Sans-serif</option></select></label><label>Font size <span id="fontValue"></span><input id="sizeSetting" type="range" min="16" max="26" step="1"></label><label class="check"><input type="checkbox" id="skipSetting"> Skip explicit scenes</label><p class="hint">In Continuous Mode, this replaces marked spicy sections with shortened recaps.</p><button class="secondary full" id="contentsBtn">Table of contents</button><button class="secondary full" id="spicyBtn">Spicy scene index</button><p class="hint">Preferences and reading progress are saved in this browser.</p></aside>
<script src="script.js"></script></body></html>
